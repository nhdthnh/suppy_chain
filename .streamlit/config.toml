# ─── Streamlit Configuration ───────────────────────────────
# Mặc định Light Mode, high-contrast, font sạch

[theme]
base                   = "light"
primaryColor           = "#111111"
backgroundColor        = "#ffffff"
secondaryBackgroundColor = "#f5f5f5"
textColor              = "#111111"
font                   = "sans serif"

[server]
runOnSave              = false
headless               = true
enableCORS             = true
enableXsrfProtection   = true
maxUploadSize          = 50

[browser]
gatherUsageStats       = false
serverAddress          = "localhost"

[runner]
# Tắt magic để giảm overhead render
magicEnabled           = false
fastReruns             = true
