# ─── Streamlit Configuration ───────────────────────────────
# Design system: Emerald (#10b981), Light mode, Inter font

[theme]
base                     = "light"
primaryColor             = "#10b981"
backgroundColor          = "#ffffff"
secondaryBackgroundColor = "#f8fafc"
textColor                = "#0f172a"
font                     = "sans serif"

[server]
runOnSave            = false
headless             = true
enableCORS           = true
enableXsrfProtection = true
maxUploadSize        = 50

[browser]
gatherUsageStats = false
serverAddress    = "localhost"

[runner]
magicEnabled = false
fastReruns   = true
